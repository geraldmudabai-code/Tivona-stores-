<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | Tivona Stores</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-card">
      <a href="index.html" class="logo auth-logo">
        <span class="logo-text">Tivona <span>Stores</span></span>
      </a>
      <h2>Reset Password</h2>
      <p class="auth-subtitle">Enter your email and choose a new password</p>
      
      <div id="auth-message" class="auth-message" style="display:none;"></div>

      <form id="forgot-form">
        <div class="form-group">
          <label for="forgot-email"><i class="fas fa-envelope"></i> Email</label>
          <input type="email" id="forgot-email" placeholder="you@example.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="new-password"><i class="fas fa-lock"></i> New Password</label>
          <input type="password" id="new-password" placeholder="At least 6 characters" required autocomplete="new-password">
          <div class="strength-meter" id="forgot-strength"></div>
          <span class="strength-text" id="forgot-strength-text"></span>
        </div>
        <div class="form-group">
          <label for="new-confirm"><i class="fas fa-lock"></i> Confirm New Password</label>
          <input type="password" id="new-confirm" placeholder="Repeat new password" required autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Reset Password</button>
      </form>

      <p class="auth-note">
        <i class="fas fa-info-circle"></i> This is a demo reset (no email is sent). Just enter the email of an existing account.
      </p>

      <p class="auth-switch">
        Remember your password? <a href="login.html">Login here</a>
      </p>
      
      <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Store</a>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
