<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Tivona Stores</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-card">
      <a href="index.html" class="logo auth-logo">
        <span class="logo-text">Tivona <span>Stores</span></span>
      </a>
      <h2>Admin / Worker Login</h2>
      <p class="auth-subtitle">Sign in with your email to manage products and stock</p>
      
      <div id="auth-message" class="auth-message" style="display:none;"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="email"><i class="fas fa-envelope"></i> Email</label>
          <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="password"><i class="fas fa-lock"></i> Password</label>
          <input type="password" id="password" placeholder="Enter password" required autocomplete="current-password">
        </div>
        <div class="form-group remember-row">
          <label>
            <input type="checkbox" id="remember"> Remember me
          </label>
          <a href="forgot-password.html" class="forgot-link">Forgot password?</a>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Login</button>
      </form>
      
      <div class="auth-info">
        <p><strong>Demo Credentials:</strong></p>
        <p>Admin: <code>admin@tivonastores.com</code> / <code>admin123</code></p>
        <p>Worker: <code>worker@tivonastores.com</code> / <code>worker123</code></p>
      </div>

      <p class="auth-switch">
        Don't have an account? <a href="register.html">Register here</a>
      </p>
      
      <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Store</a>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
