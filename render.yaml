services:
  - type: web
    name: tivona-stores
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    envVars:
      - key: TIVONA_SECRET
        generateValue: true
      - key: TIVONA_BASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.0"
